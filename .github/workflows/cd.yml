name: CD

# Runs after CI passes on main: builds the app image, checks it starts, then publishes it.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build image
        run: docker build -t wealth-manager .

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 wealth-manager
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://localhost:8000/health

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag wealth-manager "$IMAGE:latest"
          docker tag wealth-manager "$IMAGE:${SHA::7}"
          docker push --all-tags "$IMAGE"
