name: CD

# Runs after CI passes on main: builds the app image, checks it starts, then publishes it.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build image
        run: docker build -t wealth-manager .

      - name: Smoke test the image
        run: bash .github/scripts/smoke-test.sh

      - name: Save the image as a release file
        run: docker save wealth-manager | gzip > wealth-manager-image.tar.gz

      - name: Upload the image file
        uses: actions/upload-artifact@v4
        with:
          name: wealth-manager-image
          path: wealth-manager-image.tar.gz
          retention-days: 30

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag wealth-manager "$IMAGE:latest"
          docker tag wealth-manager "$IMAGE:${SHA::7}"
          docker push --all-tags "$IMAGE"
