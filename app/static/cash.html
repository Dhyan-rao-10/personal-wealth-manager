<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cash - Personal Wealth Manager</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Cash</h1>
    <section class="card">
      <h2>Add a cash account</h2>
      <form id="account-form">
        <label>Name <input name="name" required maxlength="100"></label>
        <label>Type
          <select name="type">
            <option value="cash">Cash in hand</option>
            <option value="bank">Bank account</option>
            <option value="wallet">Wallet</option>
          </select>
        </label>
        <label>Opening balance (₹) <input name="opening_balance" type="number" min="0" step="0.01" required></label>
        <button type="submit">Add account</button>
      </form>
      <p id="error" class="error" role="alert"></p>
    </section>
    <section class="card table-wrap"><table id="account-table"></table></section>
    <section class="card">
      <h2>Record a deposit or withdrawal</h2>
      <form id="transaction-form">
        <label>Account <select name="account" id="account-picker" required></select></label>
        <label>Type
          <select name="type">
            <option value="deposit">Deposit</option>
            <option value="withdrawal">Withdrawal</option>
          </select>
        </label>
        <label>Amount (₹) <input name="amount" type="number" min="0.01" step="0.01" required></label>
        <label>Note <input name="note" maxlength="200"></label>
        <button type="submit">Record</button>
      </form>
      <p id="transaction-error" class="error" role="alert"></p>
    </section>
    <section class="card table-wrap">
      <h2>Transaction history</h2>
      <table id="transaction-table"></table>
    </section>
  </main>
  <script src="/static/api.js"></script>
  <script src="/static/nav.js"></script>
  <script src="/static/cash.js"></script>
</body>
</html>
