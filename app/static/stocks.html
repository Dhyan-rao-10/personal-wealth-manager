<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stocks - Personal Wealth Manager</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Stocks</h1>
    <section class="card">
      <h2>Add a stock holding</h2>
      <form id="record-form">
        <label>Symbol <input name="symbol" required maxlength="20"></label>
        <label>Company <input name="company" required maxlength="100"></label>
        <label>Exchange
          <select name="exchange">
            <option value="NSE">NSE</option>
            <option value="BSE">BSE</option>
          </select>
        </label>
        <label>Quantity <input name="quantity" type="number" min="1" step="1" required></label>
        <label>Average buy price (₹) <input name="average_buy_price" type="number" min="0.01" step="0.01" required></label>
        <button type="submit">Add holding</button>
      </form>
      <p id="error" class="error" role="alert"></p>
    </section>
    <section class="card table-wrap"><table id="record-table"></table></section>
    <section class="card">
      <h2>Update a stock's current price</h2>
      <form id="price-form">
        <label>Holding <select name="id" id="price-holding" required></select></label>
        <label>Current price (₹) <input name="current_price" type="number" min="0.01" step="0.01" required></label>
        <button type="submit">Update price</button>
      </form>
    </section>
  </main>
  <script src="/static/api.js"></script>
  <script src="/static/nav.js"></script>
  <script src="/static/crud.js"></script>
  <script>
    const picker = document.getElementById("price-holding");
    const page = crudPage({
      url: "/api/stocks",
      columns: [
        ["Symbol", (s) => s.symbol],
        ["Company", (s) => s.company],
        ["Exchange", (s) => s.exchange],
        ["Quantity", (s) => s.quantity],
        ["Buy price", (s) => rupees(s.average_buy_price)],
        ["Current price", (s) => (s.current_price ? rupees(s.current_price) : "Not set")],
        ["Current value", (s) => rupees(s.current_value)],
        ["Gain / loss", (s) => signedRupees(s.gain_loss, s.gain_loss_percent)],
      ],
      onLoad: (stocks) => {
        picker.replaceChildren(...stocks.map((s) =>
          el("option", { value: s.id, textContent: `${s.symbol} (${s.exchange})` })));
      },
    });

    const priceForm = document.getElementById("price-form");
    priceForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const { id, current_price } = Object.fromEntries(new FormData(priceForm));
      await api(`/api/stocks/${id}/price`, { method: "PUT", body: { current_price } });
      priceForm.reset();
      await page.load();
    });
  </script>
</body>
</html>
