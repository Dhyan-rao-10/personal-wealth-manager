<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Wealth Manager</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
  <header>
    <h1>Personal Wealth Manager</h1>
    <p>Track real estate, gold, stocks and cash in one place.</p>
  </header>
  <main class="card auth-card">
    <h2 id="mode-title">Log in</h2>
    <form id="auth-form">
      <label id="name-field" hidden>Name <input name="name" autocomplete="name"></label>
      <label>Email <input name="email" type="email" required autocomplete="email"></label>
      <label>Password <input name="password" type="password" required minlength="8"
        autocomplete="current-password"></label>
      <p id="error" class="error" role="alert"></p>
      <button type="submit" id="submit-button">Log in</button>
    </form>
    <p><button type="button" class="link" id="mode-switch">New here? Create an account</button></p>
  </main>
  <script src="/static/api.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
